[project]
name = "lottery-forecast-api"
version = "0.1.0"
description = "Multi-lottery analytics and TimesFM forecasting API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary,pool]>=3.2",
    "numpy>=1.26.4",
    "pandas>=2.2",
    "scipy>=1.13",
    "httpx>=0.27",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# Real TimesFM inference. Without it the API falls back to exponential smoothing and says so.
timesfm = ["timesfm[torch]>=3.0.2"]
# Self-contained Postgres for local development and tests (used when DATABASE_URL is unset).
embedded-pg = ["pixeltable-pgserver>=0.6"]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["timesfm: runs the real TimesFM model (slow, needs the timesfm extra and weights)"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
